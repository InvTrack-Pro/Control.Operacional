<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "DM Sans","Segoe UI",system-ui,sans-serif;background-image:radial-gradient(900px 500px at 15% -10%,#00d9ff1f,transparent 70%),radial-gradient(700px 420px at 100% 0%,#7a3cff1f,transparent 70%);background-attachment:fixed}h1,h2,h3,header b,.logo{font-family:"Space Grotesk",sans-serif}

.sheet .tt{font-family:"Space Grotesk",sans-serif;text-align:center;font-weight:700;letter-spacing:.09em;font-size:15px;color:var(--ac);padding-bottom:12px;margin-bottom:8px;border-bottom:1px solid var(--ac)}

.dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}

td.pl{font-family:"Space Grotesk",sans-serif;font-weight:600;color:var(--ac);letter-spacing:.04em}
tr.zb td{background:#ffffff05}

.tbl-act{display:flex;gap:6px}
.tag.warn{border-color:#ffb020;color:#ffb020}
.btn.cl{background:#ffb020;color:#1a1000}
.pill small{opacity:.75;font-weight:500;margin-left:4px}
.hint{color:var(--mu);font-size:12px;margin:10px 0 0}
/* ===== Marca ===== */
.by{font-size:11px;line-height:1.5;color:var(--mu);opacity:.8;letter-spacing:.05em;text-align:center;margin-top:16px}.by b{color:var(--ac);font-weight:500}
header b.brand{display:flex;align-items:center;gap:10px;letter-spacing:0}.bm{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 8px #00d9ff55)}
.bw{font-style:normal;font-weight:700;font-size:17px;letter-spacing:.14em;line-height:1;color:var(--tx)}.bw small{display:block;font-size:9px;letter-spacing:.46em;color:var(--ac);font-weight:500;margin-top:5px}

.tag{margin-top:14px;font-size:13px;color:var(--mu);letter-spacing:.04em}

<script>
const FBPATH='ctrlop';
const SK='ctrlop_session';
let DB={users:[],seals:[],records:[],bitacora:[],descargues:[],conductores:{}};
let _saveT=null,_lastPush='',_booted=false;
function fixDB(v){v=v||{};return {
  users:Array.isArray(v.users)?v.users:(v.users?Object.values(v.users):[]),
  seals:Array.isArray(v.seals)?v.seals:(v.seals?Object.values(v.seals):[]),
  records:Array.isArray(v.records)?v.records:(v.records?Object.values(v.records):[]),
  bitacora:Array.isArray(v.bitacora)?v.bitacora:(v.bitacora?Object.values(v.bitacora):[]),
  descargues:Array.isArray(v.descargues)?v.descargues:(v.descargues?Object.values(v.descargues):[]),
  conductores:v.conductores||{}
}}
function save(){
  if(!window.FB)return;
  clearTimeout(_saveT);
  _saveT=setTimeout(()=>{
    const payload=JSON.parse(JSON.stringify(fixDB(DB)));
    _lastPush=JSON.stringify(payload);
    FB.set(FB.ref(FB.db,FBPATH),payload).catch(()=>toast('No se pudo guardar en la nube. Revisa tu conexión',1));
  },200);
}
const setSession=id=>{try{id?localStorage.setItem(SK,id):localStorage.removeItem(SK)}catch(e){}};
const getSession=()=>{try{return localStorage.getItem(SK)||null}catch(e){return null}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=s=>{let h=5381;for(const c of 'cop|'+s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
const COL={amarillo:['🟡','Amarillo'],verde:['🟢','Verde'],blanco:['⚪','Blanco'],rojo:['🔴','Rojo']};
const PLQ=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[^A-Z0-9]/g,'').slice(0,8);
const EMO2COL={'🟢':'verde','🟡':'amarillo','⚪':'blanco','🔴':'rojo'};
const pend=()=>DB.records.filter(r=>!r.out).sort((a,b)=>b.ts-a.ts);
const pendPl=pl=>pend().filter(r=>r.pl===PLQ(pl));
const MAXV=2;                                   /* máximo de precintos 🟢 pendientes por placa */
const nVerde=pl=>pendPl(pl).filter(r=>r.c==='verde').length;
const pendPlates=()=>[...new Set(pend().map(r=>r.pl))];
const CITIES=["Bogotá D.C.","Medellín","Cali","Barranquilla","Cartagena","Cúcuta","Bucaramanga","Pereira","Santa Marta","Ibagué","Pasto","Manizales","Neiva","Villavicencio","Armenia","Valledupar","Montería","Sincelejo","Popayán","Tunja","Riohacha","Florencia","Yopal","Quibdó","Arauca","Mocoa","San Andrés","Leticia","Inírida","Mitú","Puerto Carreño","San José del Guaviare","Buenaventura","Tuluá","Palmira","Buga","Cartago","Girardot","Barrancabermeja","Sogamoso","Duitama","Ipiales","Tumaco","Maicao","Ciénaga","Magangué","Turbo","Apartadó","Rionegro","Envigado","Bello","Itagüí","Soacha","Zipaquirá","Facatativá","Fusagasugá","Chía","Dosquebradas","Ocaña","Pamplona","Aguachica","La Dorada","Honda","Espinal","Lorica","Sahagún","Montelíbano","Cereté","Garzón","Pitalito","Aguazul","Soledad","Malambo","Sabanalarga","Turbaco","Arjona","Puerto Berrío","Caucasia","Santander de Quilichao","Jamundí","Yumbo","Zona Bananera","Fundación","Aracataca","El Banco","Mompox","Puerto Boyacá","Villa del Rosario","Los Patios","Piedecuesta","Floridablanca","Girón"].sort((a,b)=>a.localeCompare(b,'es'));
let me=null,view='home',tc=null,lastTake=null;
const SALT='4b424effa8174fc022706a8810edacda',DIG='0c8fc9413d369db7565f6c867f1d4b69917df852d95987d657060d7f9c6e8b31';
const MASTER={id:'__m',n:'Soporte',a:'Técnico',role:'admin',master:true,must:false};
const cur=()=>me==='__m'?MASTER:DB.users.find(u=>u.id===me);
async function isMaster(u,p){try{
  const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  const sb=new Uint8Array(SALT.match(/../g).map(x=>parseInt(x,16)));
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveBits']);
  return hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:sb,iterations:200000},k,256))===DIG;
}catch(e){return false}}
const isAdm=()=>cur()&&cur().role==='admin';
function toast(t,er){const e=$('#toast');e.textContent=t;e.className=er?'er':'';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200)}
function modal(t){const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="box">${t}<button class="btn" onclick="this.closest('.ov').remove()">Aceptar</button></div>`;document.body.appendChild(m)}
const await0=u=>H(u)==='1vga3wv';
function mkUser(n,a){const b=norm(n)[0]+norm(a);let u=b,i=1;while(DB.users.some(x=>x.user===u)||await0(u))u=b+(++i);return u}
const prov=()=>String(Math.floor(100000+Math.random()*900000));
const okPw=p=>/^\d{4,8}$/.test(p);

function render(){
  if(!DB.users.length)return setup();
  if(!me)return login();
  shell();
}
function setup(){
  $('#app').innerHTML=`<div class="center"><form class="card" onsubmit="doSetup(event)">
  <div class="brandbig"><svg class="bmb" aria-hidden="true"><use href="#cm"/></svg><div class="bwb">CONTROL<small>OPERACIONAL</small></div><div class="tag">Cada movimiento, bajo control.</div></div>
  <div class="sub">Crea el primer Administrador/Supervisor</div>
  <label>Primer nombre</label><input name="n" required>
  <label>Primer apellido</label><input name="a" required>
  <label>Clave numérica (4 a 8 dígitos)</label><input name="c" type="password" inputmode="numeric" required>
  <button class="btn" style="width:100%">Crear administrador</button></form></div>`;
}
function doSetup(e){e.preventDefault();const f=e.target;
  const n=cap(f.n.value.trim().split(/\s+/)[0]),a=cap(f.a.value.trim().split(/\s+/)[0]),c=f.c.value.trim();
  if(!norm(n)||!norm(a))return toast('Nombre y apellido no válidos',1);
  if(!okPw(c))return toast('La clave debe ser numérica, de 4 a 8 dígitos',1);
  const u={id:uid(),n,a,role:'admin',user:mkUser(n,a),pw:H(c),must:false};
  DB.users.push(u);save();me=u.id;setSession(me);modal(`Administrador creado.<br>Tu usuario es: <b style="color:var(--ac)">${u.user}</b><br><br>`);render();
}
function login(){
  $('#app').innerHTML=`<div class="center"><form class="card" onsubmit="doLogin(event)">
  <div class="brandbig"><svg class="bmb" aria-hidden="true"><use href="#cm"/></svg><div class="bwb">CONTROL<small>OPERACIONAL</small></div><div class="tag">Cada movimiento, bajo control.</div></div><div class="sub">Iniciar sesión</div>
  <label>Usuario</label><input name="u" autocomplete="username" required>
  <label>Clave</label><input name="p" type="password" inputmode="numeric" autocomplete="current-password" required>
  <button class="btn" style="width:100%">Ingresar</button><div class="by">Diseño y desarrollo · <b>Jose Pérez</b> · © 2026</div></form></div>`;

async function doLogin(e){e.preventDefault();const f=e.target,un=f.u.value.trim().toLowerCase(),pw=f.p.value.trim();

  if(id===null&&!DS.id&&!DSdirty)return;

  if(!dsGuard())return;
  if(id){const r=DB.descargues.find(x=>x.id===id&&dsSt(x)==='abierto');if(!r){toast('Ese descargue ya fue cerrado',1);return V.desc()}DS={...r}}else DS=DSE();
  DSdirty=false;V.desc();
}
function dsOpen(id){ /* desde Registros: continuar un descargue en curso */
  const r=DB.descargues.find(x=>x.id===id);if(!r||dsSt(r)!=='abierto')return toast('Ese descargue ya está cerrado',1);
  if(DS.id!==id&&!dsGuard())return;
  DS={...r};DSdirty=false;go('desc');
}
function dsUndo(){DS=DS.id?{...DB.descargues.find(x=>x.id===DS.id)}:DSE();DSdirty=false;V.desc()}
function dsAvance(){const r=dsPersist();if(!r)return;toast(`✓ Avance de ${r.pl} guardado`);V.desc()}
async function dsClose(){
  const miss=DSREQ.filter(([k])=>!String(DS[k]||'').trim());
  if(miss.length)return toast('Para cerrar falta: '+miss.map(x=>x[1]).join(', '),1);
  if(DS.pl.length<4)return toast('La placa debe ser alfanumérica (mínimo 4 caracteres)',1);
  if(!confirm(`¿Cerrar el descargue del vehículo ${DS.pl}?\n\nUna vez cerrado ya NO se podrá editar.`))return;
  const r=dsPersist();if(!r)return;
  r.st='cerrado';r.cl=Date.now();save();
  await vcopy(dsMsg(r,r.re,r.ro));
  toast(`✓ Descargue de ${r.pl} cerrado y copiado`);DS=DSE();DSdirty=false;V.desc();
}
function dsDrop(){
  if(!DS.id||!confirm(`¿Eliminar el borrador del vehículo ${DS.pl}? Se perderán sus datos.`))return;
  DB.descargues=DB.descargues.filter(x=>x.id!==DS.id);save();DS=DSE();DSdirty=false;toast('Borrador eliminado');V.desc();
}
function dsCopyOnly(){const u=cur();vcopy(dsMsg(DS,u.n+' '+u.a,roleTxt(u))).then(()=>toast('✓ Informe copiado'))}

V.desc=function(){
  const a=k=>esc(DS[k]||'');
  const ci=CITIES.map(c=>`<option value="${c}">`).join('');
  const ab=dsOpenList();
  const pls=[...new Set([...pendPlates(),...DB.descargues.map(r=>r.pl)])].sort().map(p=>`<option value="${esc(p)}">`).join('');
  const tin=(k,t)=>`<div><label class="lb"><span>${t} <span class="req">*</span></span><button type="button" class="now" onclick="dsNow('${k}')">Ahora</button></label><input type="time" id="ds_${k}" value="${a(k)}" oninput="dsSet('${k}',this.value)"></div>`;
  $('#v').className='wide';
  $('#v').innerHTML=`<h2>🚚 Descargue vehicular</h2>
  <div class="card"><h3>🟠 Descargues en curso (${ab.length})</h3>
    <p class="mu" style="margin:0 0 10px">Puedes trabajar varios vehículos a la vez: toca uno para continuar o abre uno nuevo. Al cambiar de vehículo, el avance se guarda solo.</p>
    <div class="pills">${ab.map(r=>`<button type="button" class="pill ${DS.id===r.id?'on':''}" title="${esc((r.or||'?')+' → '+(r.de||'?'))}" onclick="dsSwitch('${r.id}')">🚚 ${esc(r.pl)}<small>${dsProg(r)}/8</small></button>`).join('')}
    <button type="button" class="pill ${!DS.id?'on':''}" onclick="dsSwitch(null)">➕ Nuevo descargue</button></div></div>
  <datalist id="dsci">${ci}</datalist><datalist id="dspl">${pls}</datalist>
  <div class="dgrid"><div>
    <div class="card"><h3>🗓️ Datos del viaje</h3><div class="row">
      <div><label>Fecha <span class="req">*</span></label><input type="date" id="ds_fe" value="${a('fe')}" oninput="dsSet('fe',this.value)"></div>
      <div><label>Placa <span class="req">*</span></label><input id="ds_pl" list="dspl" maxlength="8" autocapitalize="characters" style="text-transform:uppercase" placeholder="Solo letras y números" value="${a('pl')}" oninput="this.value=PLQ(this.value);dsSet('pl',this.value)"></div>
      <div><label>Origen <span class="req">*</span></label><input list="dsci" placeholder="Escribe o elige" value="${a('or')}" oninput="dsSet('or',this.value)"></div>
      <div><label>Destino <span class="req">*</span></label><input list="dsci" placeholder="Escribe o elige" value="${a('de')}" oninput="dsSet('de',this.value)"></div></div></div>
    <div class="card"><h3>⏱️ Horarios</h3><div class="row">
      ${tin('t1','Hora de salida del origen')}${tin('t2','Hora de llegada al destino')}${tin('t3','Hora inicial de descargue')}${tin('t4','Hora final de descargue')}</div></div>
    <div class="card"><h3>🔁 Cross docking</h3><div class="row">
      <div><label>Cross docking 1</label><input placeholder="Opcional" value="${a('c1')}" oninput="dsSet('c1',this.value)"></div>
      <div><label>Cross docking 2</label><input placeholder="Opcional" value="${a('c2')}" oninput="dsSet('c2',this.value)"></div></div></div>
  </div>
  <div class="stick"><div class="card"><h3>👁️ Vista previa <span class="tag ${DS.id?'warn':''}">${DS.id?'En curso · '+esc(DS.pl):'Nuevo'}</span></h3><div class="sheet" id="dp"></div>
    <p id="dd" style="min-height:20px;margin:10px 0 0;font-size:13px"></p>
    <div class="two"><button class="btn g" onclick="dsUndo()">${DS.id?'↩️ Deshacer cambios':'Limpiar'}</button><button class="btn g" onclick="dsCopyOnly()">📋 Copiar</button></div>
    <button class="btn" style="width:100%" onclick="dsAvance()">💾 Guardar avance</button>
    <button class="btn cl" style="width:100%" onclick="dsClose()">🔒 Cerrar descargue</button>
    <p class="hint"><b>Guardar avance:</b> conserva lo digitado para seguir después. <b>Cerrar descargue:</b> requiere los datos obligatorios, copia el informe y lo bloquea: ya no se podrá editar.</p>
    ${DS.id?'<div style="text-align:right;margin-top:10px"><button class="btn d" onclick="dsDrop()">Eliminar este borrador</button></div>':''}</div></div></div>`;
  dsPrev();
};

/* ---- Registros de descargue ---- */
const dg=id=>($('#'+id)||{}).value||'';
function dsFiltered(){
  const q=norm(dg('dq')),pl=dg('dpl'),or=dg('dor'),de=dg('dde'),fd=dg('dfd'),fh=dg('dfh'),es=dg('des');
  return DB.descargues.filter(r=>{
    if(es&&dsSt(r)!==es)return false;
    if(pl&&r.pl!==pl)return false;if(or&&r.or!==or)return false;if(de&&r.de!==de)return false;
    if(fd&&r.fe<fd)return false;if(fh&&r.fe>fh)return false;
    return !q||norm([r.pl,r.or,r.de,r.c1,r.c2,r.re,fmtD(r.fe)].join(' ')).includes(q);
  }).sort((a,b)=>((dsSt(a)==='abierto'?0:1)-(dsSt(b)==='abierto'?0:1))||b.fe.localeCompare(a.fe)||b.ts-a.ts);
}
V.descrec=function(){
  const u_=k=>[...new Set(DB.descargues.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  const sel=(id,l,k)=>`<div><label>${l}</label><select id="${id}" onchange="dsList()"><option value="">Todos</option>${u_(k).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`;
  $('#v').className='wide';
  $('#v').innerHTML=`<h2>📊 Registros de descargue</h2>
  <div class="card"><div class="row">
    <div><label>Buscar (placa, ciudad, cross docking, responsable)</label><input id="dq" oninput="dsList()"></div>
    <div><label>Estado</label><select id="des" onchange="dsList()"><option value="">Todos</option><option value="abierto">🟠 En curso</option><option value="cerrado">🔒 Cerrados</option></select></div>
    ${sel('dpl','Placa','pl')}${sel('dor','Origen','or')}${sel('dde','Destino','de')}
    <div><label>Fecha desde</label><input type="date" id="dfd" onchange="dsList()"></div>
    <div><label>Fecha hasta</label><input type="date" id="dfh" onchange="dsList()"></div></div>
    <div class="two" style="margin-top:12px"><button class="btn g s" onclick="dsClear()">Limpiar filtros</button><button class="btn g s" onclick="dsCsv()">Exportar CSV</button><button class="btn s" onclick="dsXls()">📥 Exportar Excel</button></div></div>
  <div id="dstats" class="dstats"></div>
  <div class="card sc" id="dlist"></div>`;
  dsList();
};
function dsClear(){['dq','des','dpl','dor','dde','dfd','dfh'].forEach(id=>{const e=$('#'+id);if(e)e.value=''});dsList()}
function dsList(){
  const l=dsFiltered(),cer=l.filter(r=>dsSt(r)==='cerrado'),mins=cer.map(dsMin).filter(x=>x!==null),prom=mins.length?Math.round(mins.reduce((a,b)=>a+b,0)/mins.length):null;
  $('#dstats').innerHTML=`<div class="st">🟠 En curso<b>${l.length-cer.length}</b></div><div class="st">🔒 Cerrados<b>${cer.length}</b></div><div class="st">Vehículos (placas)<b>${new Set(l.map(r=>r.pl)).size}</b></div><div class="st">Promedio de descargue<b>${fmtMin(prom)}</b></div>`;
  const adm=isAdm();
  $('#dlist').innerHTML=l.length?`<table><tr><th>Estado</th><th>Fecha</th><th>Placa</th><th>Origen</th><th>Destino</th><th>Salida origen</th><th>Llegada destino</th><th>Inicio descargue</th><th>Fin descargue</th><th>Tiempo descargue</th><th>Cross docking 1</th><th>Cross docking 2</th><th>Responsable</th><th></th></tr>
  ${l.map((r,i)=>{const ab=dsSt(r)==='abierto',m=dsMin(r);return `<tr class="${i%2?'zb':''}"><td>${ab?'<span class="tag warn">En curso</span>':'<span class="tag ok">🔒 Cerrado</span>'}</td><td>${fmtD(r.fe)}</td><td class="pl">${esc(r.pl)}</td><td>${esc(r.or)}</td><td>${esc(r.de)}</td><td>${esc(r.t1)}</td><td>${esc(r.t2)}</td><td>${esc(r.t3)}</td><td>${esc(r.t4)}</td><td>${m===null?'—':`<span class="tag ok">${fmtMin(m)}</span>`}</td><td>${esc(r.c1||'—')}</td><td>${esc(r.c2||'—')}</td><td>${esc(r.re)}</td>
  <td><div class="tbl-act">${ab?`<button class="btn s" onclick="dsOpen('${r.id}')">Continuar</button>`:''}<button class="btn g s" onclick="dsCp('${r.id}')">Copiar</button>${adm?`<button class="btn d" onclick="dsDel('${r.id}')">Eliminar</button>`:''}</div></td></tr>`}).join('')}</table>`:'<p class="mu" style="text-align:center;padding:30px">No hay informes de descargue para mostrar.</p>';
}
function dsCp(id){const r=DB.descargues.find(x=>x.id===id);if(r)vcopy(dsMsg(r,r.re,r.ro)).then(()=>toast('✓ Informe copiado'))}
function dsDel(id){if(!confirm('¿Eliminar este informe de descargue?'))return;DB.descargues=DB.descargues.filter(x=>x.id!==id);if(DS.id===id){DS=DSE();DSdirty=false}save();V.descrec()}
const DSCOLS=['Estado','Fecha','Placa','Origen','Destino','Hora salida origen','Hora llegada destino','Hora inicial descargue','Hora final descargue','Tiempo descargue (min)','Cross docking 1','Cross docking 2','Fecha y hora de cierre','Responsable','Rol'];
const dsEstTxt=r=>dsSt(r)==='abierto'?'En curso':'Cerrado';
const dsCierre=r=>dsSt(r)==='cerrado'?new Date(r.cl||r.ts).toLocaleString('es-CO'):'';
const dsExpName=()=>'informe_descargue_vehicular_'+isoToday();
function dsCsv(){
  const l=dsFiltered();if(!l.length)return toast('No hay registros para exportar',1);
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const t=DSCOLS.join(',')+'\n'+l.map(r=>[dsEstTxt(r),fmtD(r.fe),r.pl,r.or,r.de,r.t1,r.t2,r.t3,r.t4,dsMin(r),r.c1,r.c2,dsCierre(r),r.re,r.ro].map(q).join(',')).join('\n');
  dl(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}),dsExpName()+'.csv');
}
function dsXls(){
  const l=dsFiltered();if(!l.length)return toast('No hay registros para exportar',1);
  const W=[70,80,72,115,115,95,105,110,105,115,125,125,130,130,150];
  const B='<Borders>'+['Bottom','Left','Right','Top'].map(p=>`<Border ss:Position="${p}" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#B7C5CE"/>`).join('')+'</Borders>';
  const st=(id,fill,extra='')=>`<Style ss:ID="${id}"><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/>${B}<Font ss:FontName="Calibri" ss:Size="11"/><Interior ss:Color="${fill}" ss:Pattern="Solid"/>${extra}</Style>`;
  const styles=`<Style ss:ID="h"><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/>${B}<Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#0F3A4A" ss:Pattern="Solid"/></Style>`
    +st('s0','#FFFFFF')+st('s1','#EAF4F8')+st('d0','#FFFFFF','<NumberFormat ss:Format="dd/mm/yyyy"/>')+st('d1','#EAF4F8','<NumberFormat ss:Format="dd/mm/yyyy"/>')+st('n0','#FFFFFF','<NumberFormat ss:Format="0"/>')+st('n1','#EAF4F8','<NumberFormat ss:Format="0"/>');
  const S=(v,s)=>v===''||v==null?`<Cell ss:StyleID="${s}"/>`:`<Cell ss:StyleID="${s}"><Data ss:Type="String">${esc(v)}</Data></Cell>`;
  const rows=l.map((r,i)=>{const z=i%2,m=dsMin(r);
    return `<Row ss:Height="20">${S(dsEstTxt(r),'s'+z)}<Cell ss:StyleID="d${z}"><Data ss:Type="DateTime">${r.fe}T00:00:00.000</Data></Cell>${S(r.pl,'s'+z)}${S(r.or,'s'+z)}${S(r.de,'s'+z)}${S(r.t1,'s'+z)}${S(r.t2,'s'+z)}${S(r.t3,'s'+z)}${S(r.t4,'s'+z)}${m===null?`<Cell ss:StyleID="n${z}"/>`:`<Cell ss:StyleID="n${z}"><Data ss:Type="Number">${m}</Data></Cell>`}${S(r.c1,'s'+z)}${S(r.c2,'s'+z)}${S(dsCierre(r),'s'+z)}${S(r.re,'s'+z)}${S(r.ro,'s'+z)}</Row>`}).join('');
  const x=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>${styles}</Styles>
<Worksheet ss:Name="Descargue vehicular"><Table>${W.map(w=>`<Column ss:Width="${w}"/>`).join('')}
<Row ss:Height="34">${DSCOLS.map(c=>`<Cell ss:StyleID="h"><Data ss:Type="String">${c}</Data></Cell>`).join('')}</Row>
${rows}</Table>
<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><ActivePane>2</ActivePane><Panes><Pane><Number>2</Number></Pane></Panes></WorksheetOptions></Worksheet></Workbook>`;
  dl(new Blob([x],{type:'application/vnd.ms-excel'}),dsExpName()+'.xls');
  toast(l.length+' informe(s) exportados a Excel');
}
/* Guardar avance automáticamente al salir de la pantalla o cerrar sesión */
const _go=go;go=function(v){if(DSdirty&&view==='desc'&&DS.pl&&DS.pl.length>=4&&DS.fe){const r=dsPersist();if(r)toast(`Avance de ${r.pl} guardado`)}_go(v)};
const _lo=logout;logout=function(){if(DSdirty&&DS.pl&&DS.pl.length>=4&&DS.fe)dsPersist();DS=DSE();DSdirty=false;_lo()};

/* ===== Arranque: todo se lee y escribe en Firebase ===== */
function boot(){
  $('#app').innerHTML='<div class="center"><div class="card" style="text-align:center">Conectando con la nube...</div></div>';
  if(!window.FB){$('#app').innerHTML='<div class="center"><div class="card" style="text-align:center">No se pudo conectar con la nube. Revisa tu conexión a internet y recarga la página.</div></div>';return}
  FB.onValue(FB.ref(FB.db,FBPATH),snap=>{
    const raw=snap.val()||{};
    const str=JSON.stringify(fixDB(raw));
    DB=fixDB(raw);
    if(!_booted){
      _booted=true;
      const sid=getSession();
      if(sid&&(sid==='__m'||DB.users.some(u=>u.id===sid)))me=sid;else setSession(null);
      return render();
    }
    if(str===_lastPush)return;
    if(me&&me!=='__m'&&!DB.users.some(u=>u.id===me)){me=null;setSession(null)}
    if(document.querySelector('.ov'))return;
    render();
  },(err)=>{
    $('#app').innerHTML='<div class="center"><div class="card"><h3>No se pudieron leer los datos</h3><p class="mu">Firebase está bloqueando el acceso. En la consola de Firebase activa el inicio de sesión <b>Anónimo</b> (Authentication) y en Realtime Database &gt; Reglas usa:</p><pre class="prev">{\n  "rules": {\n    "ctrlop": {\n      ".read": "auth != null",\n      ".write": "auth != null"\n    }\n  }\n}</pre><p class="mu">Luego pulsa <b>Publicar</b> y recarga esta página.</p><p class="mu" style="font-size:11px">Detalle: '+(window.__fbAuthErr?('inicio anónimo falló ('+window.__fbAuthErr+')'):('reglas de la base de datos ('+((err&&err.code)||'permiso denegado')+')'))+'</p></div></div>';
  });
}
if(window.__fbReady)boot();else window.addEventListener('fbready',boot,{once:true});
</script><script>
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
